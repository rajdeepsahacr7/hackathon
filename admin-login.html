<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0806'/%3E%3Cg fill='none' stroke='%23ba9d59' stroke-linecap='round'%3E%3Ccircle cx='13' cy='13' r='8.6' stroke-width='1.9'/%3E%3Cpath d='M19.3 19.3 27.5 27.5' stroke-width='2.6'/%3E%3Cg stroke-width='1.4' opacity='.8'%3E%3Cpath d='M8.6 10.4h4.3M14.7 10.4h2.7M8.6 13h2.5M12.9 13h4.5M8.6 15.6h5.6'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- theme.css is loaded before every page-specific stylesheet so its
       tokens are available to them and they can still override locally. -->
  <link rel="stylesheet" href="theme.css">
  <title>Admin Login | The Coded Cipher</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin-login.css">
  <script src="admin-login.js" defer></script>
  <script src="theme.js" defer></script>
</head>
<body>

<div class="sh-scene sh-scene--cipher al-backdrop" aria-hidden="true">
  <div class="sh-skyline"></div>
  <div class="sh-windows"></div>
  <div class="sh-fog"></div>
</div>

<form class="al-card sh-corners" id="adminLoginForm">
  <div class="al-crest" aria-hidden="true">
    <svg viewBox="0 0 48 48" fill="none">
      <path d="M24 3 42 10v14c0 10.4-7.2 18.6-18 21-10.8-2.4-18-10.6-18-21V10L24 3Z"
            stroke="currentColor" stroke-width="1.6" fill="none"/>
      <circle cx="24" cy="21" r="7" stroke="currentColor" stroke-width="1.5"/>
      <path d="M29 26l7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
  <p class="al-eyebrow">Scotland Yard &middot; Restricted</p>
  <h1 class="al-heading">Inspector&rsquo;s Entrance</h1>
  <p class="al-sub">Credentials are required beyond this door.</p>

  <div class="al-field-group">
    <label class="al-field-label" for="username">Username</label>
    <input type="text" id="username" name="username" class="al-input" autocomplete="username">
  </div>

  <div class="al-field-group">
    <label class="al-field-label" for="password">Password</label>
    <input type="password" id="password" name="password" class="al-input" autocomplete="current-password">
  </div>

  <p class="al-error" id="loginError"></p>

  <div class="al-submit-row">
    <button type="submit" class="al-submit-btn">Present Credentials</button>
  </div>
</form>

</body>
</html>
