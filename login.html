<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0806'/%3E%3Cg fill='none' stroke='%23ba9d59' stroke-linecap='round'%3E%3Ccircle cx='13' cy='13' r='8.6' stroke-width='1.9'/%3E%3Cpath d='M19.3 19.3 27.5 27.5' stroke-width='2.6'/%3E%3Cg stroke-width='1.4' opacity='.8'%3E%3Cpath d='M8.6 10.4h4.3M14.7 10.4h2.7M8.6 13h2.5M12.9 13h4.5M8.6 15.6h5.6'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- theme.css is loaded before every page-specific stylesheet so its
       tokens are available to them and they can still override locally. -->
  <link rel="stylesheet" href="theme.css">
<title>Case File Access — The Baker Street Hackathon</title>
<link rel="stylesheet" href="login.css">
  <script src="theme.js" defer></script>
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="fog a"></div>
    <div class="fog b"></div>
    <svg class="skyline" viewBox="0 0 1200 220" preserveAspectRatio="none">
      <rect x="0" y="150" width="90" height="70"/>
      <rect x="80" y="115" width="60" height="105"/>
      <rect x="150" y="160" width="75" height="60"/>
      <rect x="235" y="105" width="50" height="115"/>
      <g>
        <rect x="300" y="40" width="46" height="180"/>
        <polygon points="300,40 323,8 346,40"/>
        <circle class="lamp" cx="323" cy="72" r="3"/>
      </g>
      <rect x="360" y="135" width="80" height="85"/>
      <rect x="450" y="165" width="60" height="55"/>
      <rect x="520" y="120" width="55" height="100"/>
      <rect x="585" y="150" width="70" height="70"/>
      <rect x="665" y="100" width="55" height="120"/>
      <rect x="730" y="145" width="90" height="75"/>
      <rect x="830" y="118" width="60" height="102"/>
      <rect x="900" y="155" width="75" height="65"/>
      <rect x="985" y="130" width="55" height="90"/>
      <rect x="1050" y="160" width="80" height="60"/>
      <rect x="1140" y="110" width="60" height="110"/>
      <circle class="lamp" cx="120" cy="212" r="3" style="animation-delay:-2s"/>
      <circle class="lamp" cx="470" cy="212" r="3" style="animation-delay:-3.4s"/>
      <circle class="lamp" cx="760" cy="212" r="3" style="animation-delay:-1.1s"/>
      <circle class="lamp" cx="1010" cy="212" r="3" style="animation-delay:-4s"/>
    </svg>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="stamp">CONFIDENTIAL</div>

    <svg class="seal-medallion" width="82" height="82" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="wax1" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#9c3244"/>
          <stop offset="55%" stop-color="#7a2331"/>
          <stop offset="100%" stop-color="#3f1017"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#wax1)" stroke="#2f0b10" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.15)" stroke-dasharray="2 4"/>
      <circle cx="50" cy="50" r="36" fill="none" stroke="rgba(240,196,90,.4)"/>
      <text x="50" y="59" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#ecdfc0">SH</text>
    </svg>

    <p class="eyebrow">221B Baker Street &middot; Estd. 1887</p>
    <h1>Login</h1>
    <p class="subtitle">Present your credentials, Detective &mdash; your case file awaits within.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">
          <svg class="icon-magnifier" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="14.5" y1="14.5" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Username</span><span class="tag">under review</span>
        </label>
        <input type="text" id="username" name="username" placeholder="Your registered alias" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">
          <svg class="icon-magnifier" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="14.5" y1="14.5" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Password</span><span class="tag">under review</span>
        </label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="Your passphrase" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="toggle-password" aria-label="Show passphrase">
            <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
          </button>
        </div>
      </div>

      <div class="options-row">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          <span class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ecdfc0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 10 18 20 6"/></svg>
          </span>
          <span>Remember this case</span>
        </label>
        <a href="#" class="forgot-link">Forgotten your cipher?</a>
      </div>

      <p class="footnote" id="login-error" style="color:#c0605f; min-height:1.2em;"></p>

      <div class="submit-row">
        <p class="new-here">New to Baker Street? <a href="signup.html">Open a case file</a></p>
        <button type="submit" class="seal-btn" id="submit-btn">
          <svg class="seal-icon" width="20" height="20" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="wax2" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#c9a24e"/>
                <stop offset="100%" stop-color="#7c5a26"/>
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="46" fill="url(#wax2)"/>
            <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
          </svg>
          <span class="btn-text">Unlock the Case File</span>
        </button>
      </div>
    </form>

    <p class="footnote">Access is logged in the strictest confidence, per the code of the Baker Street Irregulars.</p>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    // "Under investigation" focus state
    document.querySelectorAll('.field').forEach(function (field) {
      var input = field.querySelector('input');
      if (!input) return;
      input.addEventListener('focus', function () { field.classList.add('investigating'); });
      input.addEventListener('blur', function () { field.classList.remove('investigating'); });
    });

    // Show / hide passphrase
    var pwInput = document.getElementById('password');
    var toggleBtn = document.getElementById('toggle-password');
    toggleBtn.addEventListener('click', function () {
      var showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      toggleBtn.classList.toggle('revealed', !showing);
      toggleBtn.setAttribute('aria-label', showing ? 'Show passphrase' : 'Hide passphrase');
    });

    // Submit: a brief "consulting the ledger" beat, then seal the result
    var form = document.getElementById('login-form');
    var submitBtn = document.getElementById('submit-btn');
    var btnText = submitBtn.querySelector('.btn-text');
    var errorText = document.getElementById('login-error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }

      errorText.textContent = '';
      submitBtn.disabled = true;
      submitBtn.classList.add('checking');
      btnText.textContent = 'Consulting the Ledger\u2026';

      fetch('api/login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: pwInput.value
        })
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          submitBtn.classList.remove('checking');
          if (!result.ok || !result.data.success) {
            errorText.textContent = (result.data && result.data.error) || 'Invalid username or password.';
            submitBtn.disabled = false;
            btnText.textContent = 'Unlock the Case File';
            return;
          }
          submitBtn.classList.add('stamped');
          btnText.textContent = 'Case File Unlocked';
          window.location.href = 'profile.html';
        })
        .catch(function () {
          submitBtn.classList.remove('checking');
          errorText.textContent = 'Could not reach the server. Is the PHP/MySQL backend running?';
          submitBtn.disabled = false;
          btnText.textContent = 'Unlock the Case File';
        });
    });
  });
</script>
</body>
</html>
