<div class="sa-page-badge-row"><span class="sa-page-badge">My Applications</span></div>
<div class="sa-wrap">
  <div class="sa-table-wrap">
    <table class="sa-table">
      <thead><tr><th>Hackathon</th><th>Referral code</th><th>Status</th><th>Dates</th><th></th></tr></thead>
      <tbody id="maBody"><tr><td colspan="5">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</div>
<script src="site-forms.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const body = document.getElementById('maBody');
  const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  const label = { submitted: 'Submitted', under_review: 'Under review', accepted: 'Accepted', rejected: 'Not selected' };
  const colour = { submitted: '#d8d8d8', under_review: '#d98c3f', accepted: '#7fbf7f', rejected: '#d16a6a' };
  api.get('api/me.php').then(({ data }) => {
    if (!data.participant) { window.location.href = 'login.html'; return null; }
    return api.get('api/applications_mine.php');
  }).then((res) => {
    if (!res) return;
    const list = res.data.applications || [];
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="5">You haven\'t applied to any hackathons yet. ' +
                       '<a href="hackathons.html" class="sa-email-link">Browse open cases</a>.</td></tr>';
      return;
    }
    body.innerHTML = list.map((a) => {
      const dates = a.hackathonStart ? esc(a.hackathonStart) + ' → ' + esc(a.hackathonEnd || '') : 'TBA';
      return '<tr>' +
        '<td>' + esc(a.hackathonName) + '</td>' +
        '<td class="sa-id-cell">' + esc(a.referralCode) + '</td>' +
        '<td style="color:' + (colour[a.status] || '#d8d8d8') + '">' + (label[a.status] || a.status) + '</td>' +
        '<td>' + dates + '</td>' +
        '<td><a class="sa-email-link" href="hackathon-details.html?id=' + encodeURIComponent(a.hackathonId) + '">View</a></td>' +
      '</tr>';
    }).join('');
  }).catch(() => { body.innerHTML = '<tr><td colspan="5">Could not reach the server.</td></tr>'; });
});
</script>
</body>
</html>
