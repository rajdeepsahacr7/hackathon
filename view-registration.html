<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0806'/%3E%3Cg fill='none' stroke='%23ba9d59' stroke-linecap='round'%3E%3Ccircle cx='13' cy='13' r='8.6' stroke-width='1.9'/%3E%3Cpath d='M19.3 19.3 27.5 27.5' stroke-width='2.6'/%3E%3Cg stroke-width='1.4' opacity='.8'%3E%3Cpath d='M8.6 10.4h4.3M14.7 10.4h2.7M8.6 13h2.5M12.9 13h4.5M8.6 15.6h5.6'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- theme.css is loaded before every page-specific stylesheet so its
       tokens are available to them and they can still override locally. -->
  <link rel="stylesheet" href="theme.css">
  <title>View Registration | Admin</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="superadmin.css">
  <link rel="stylesheet" href="admin-detail.css">
  <link rel="stylesheet" href="hackathon-apply.css">
  <link rel="stylesheet" href="view-registration.css">
  <script src="theme.js" defer></script>
</head>
<body>

<nav class="sa-navbar">
  <div class="sa-nav-spacer">
    <a href="index.html" class="sh-brand" aria-label="The Coded Cipher — home">
      <svg class="sh-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="9.5" stroke="currentColor" stroke-width="2"/>
        <path d="M19.3 19.3 27.5 27.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.75">
          <path d="M8.6 10.4h4.3M14.7 10.4h2.7M8.6 13h2.5M12.9 13h4.5M8.6 15.6h5.6"/>
        </g>
      </svg>
      <span class="sh-brand-text">
        <span class="sh-brand-name">The Coded Cipher</span>
        <span class="sh-brand-sub">221B &middot; Estd. 1887</span>
      </span>
    </a>
  </div>
  <div class="sa-nav-links">
    <a href="index.html">Home</a>
    <a href="about-us.html">About</a>
    <a href="contact-us.html">Contact</a>
  </div>
  <div class="sa-nav-user">
    <span class="sa-nav-avatar" id="saNavAvatar">&hellip;</span>
    <span class="sa-nav-name" id="saNavName">&hellip;</span>
    <a href="#" id="adminLogoutLink" style="margin-left:14px; font-size:0.75rem; letter-spacing:0.08em; opacity:0.75;">LOGOUT</a>
  </div>
</nav>

<div class="sa-page-badge-row">
  <span class="sa-page-badge">View Registration</span>
</div>

<div class="ad-wrap">
  <a href="admin-registrations.html" class="ad-back-link">&#8592; Back to Registrations</a>

  <div class="ad-field-group">
    <label class="ad-field-label" for="participantName">Name</label>
    <input type="text" id="participantName" class="ad-input" value="" readonly>
  </div>

  <div class="ad-field-group">
    <label class="ad-field-label">Technical skills</label>
    <div class="vr-skills-row" id="vrSkillsRow"></div>
  </div>

  <div class="ad-field-group">
    <label class="ad-field-label">Links</label>
    <div class="ha-link-row vr-link-row">
      <span class="ha-link-icon gh">GH</span>
      <span class="ha-link-prefix">github.com/</span>
      <input type="text" id="githubUsername" class="ha-link-input" value="" readonly>
    </div>
    <div class="ha-link-row vr-link-row">
      <span class="ha-link-icon li">in</span>
      <span class="ha-link-prefix">linkedin.com/in/</span>
      <input type="text" id="linkedinUsername" class="ha-link-input" value="" readonly>
    </div>
  </div>

  <div class="ad-field-group">
    <label class="ad-field-label" for="phoneNumber">Phone Number</label>
    <input type="text" id="phoneNumber" class="ad-input" value="" readonly>
  </div>

  <div class="ad-field-group">
    <label class="ad-field-label" for="emailAddress">Email Address</label>
    <input type="email" id="emailAddress" class="ad-input ad-input-underline" value="" readonly>
  </div>

  <div class="ad-field-group">
    <label class="ad-field-label" for="address">Address</label>
    <textarea id="address" class="ad-input ad-textarea-large" readonly></textarea>
  </div>

</div>

<script src="view-registration.js"></script>
</body>
</html>
